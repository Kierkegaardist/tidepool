    <radialGradient id="c" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#FFF6C8"/><stop offset=".6" stop-color="#FFC94A"/><stop offset="1" stop-color="#E08A10"/></radialGradient>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
