<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Tidepool dock</title>
<!-- Tidepool's own taskbar (src/Dock.cs): the menu orb, one icon per open window, the tray, the clock. The host posts { wins: [{ id, title, app, art, minimized }], fg, edge }
     and sizes the window to the length this page reports ({ op: "size", n }). Click = front (or down, if it is in front), middle-click = close; drag the empty glass to move it to another edge. -->
<style>
  html,body{margin:0;height:100%;overflow:hidden;user-select:none;font:600 15px/1 "Segoe UI",Tahoma,sans-serif;color:#fff;--accent:#00B4E6}
  body{background:linear-gradient(170deg,rgba(40,62,82,1),rgba(10,20,30,1));box-sizing:border-box;border:1px solid rgba(255,255,255,.28);border-radius:18px;box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
  #bar{position:absolute;left:0;top:0;height:100%;width:max-content;display:flex;align-items:center;gap:6px;padding:0 10px;box-sizing:border-box}
  .v #bar{width:100%;height:max-content;flex-direction:column;padding:10px 0}
  .tight #bar{width:100%}.v.tight #bar{height:100%}
  #wins{display:flex;gap:4px;align-items:center;min-width:0;min-height:0;overflow:auto;scrollbar-width:none}.v #wins{flex-direction:column}
  .tight #wins{flex:1}
  .b{position:relative;flex:none;width:44px;height:44px;display:grid;place-items:center;border-radius:12px;cursor:pointer}
  .b:hover{background:rgba(255,255,255,.13)}.b:active{background:rgba(255,255,255,.2)}
  .b img{width:30px;height:30px;pointer-events:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
  .b.min img{opacity:.5}
  .b.fg{background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.07))}
  .b.fg::after{content:"";position:absolute;left:12px;right:12px;bottom:1px;height:3px;border-radius:2px;background:var(--accent);box-shadow:0 0 6px var(--accent)}
  .top .b.fg::after{bottom:auto;top:1px}
  .left .b.fg::after{left:1px;right:auto;top:12px;bottom:12px;width:3px;height:auto}.right .b.fg::after{right:1px;left:auto;top:12px;bottom:12px;width:3px;height:auto}
  #orb img{width:34px;height:34px}
  .vr{flex:none;width:1px;height:30px;background:rgba(255,255,255,.25)}.v .vr{width:30px;height:1px}
  #tray svg{width:20px;height:20px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.5))}
  .v #tray svg{transform:rotate(var(--rot,0deg))}.left{--rot:90deg}.right{--rot:-90deg}.bottom #tray svg{transform:none}.top #tray svg{transform:rotate(180deg)}
  #clk{flex:none;padding:0 8px;text-align:center;text-shadow:0 1px 2px rgba(0,0,0,.5)}#clk small{display:block;font:400 11px/1.3 "Segoe UI",sans-serif;opacity:.75;margin-top:3px}
  .v #clk{padding:6px 0;font-size:14px}
</style></head><body class="bottom">
<div id="bar">
  <span class="b" id="orb" title="Tidepool menu"><img src="assets/icons/orb.svg" alt="Menu"></span><span class="vr"></span>
  <span id="wins"></span><span class="vr"></span>
  <span class="b" id="tray" title="Tray icons"><svg viewBox="0 0 24 24" aria-label="Tray icons"><path d="M6 15l6-6 6 6" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
  <span id="clk"></span>
</div>
<script>
const $ = id => document.getElementById(id), post = m => window.chrome?.webview?.postMessage(m);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
let edge = "bottom", sent = 0;
const vert = () => edge === "left" || edge === "right";

function fit() {   // report the natural length; if the window is shorter than that, the window icons scroll
  document.body.classList.remove("tight");
  const r = $("bar").getBoundingClientRect(), n = vert() ? r.height : r.width;
  if (n !== sent) { sent = n; post({ op: "size", n }); }
  if (n > (vert() ? innerHeight : innerWidth) + 1) document.body.classList.add("tight");
}

function clock() {
  const d = new Date(), t = d.toTimeString().slice(0, 5);   // 24-hour, like the desktop's clock (core.js hm)
  $("clk").innerHTML = vert() ? t.replace(":", "<br>") : `${t}<small>${d.toLocaleDateString([], { day: "numeric", month: "short" })}</small>`;
}
setInterval(clock, 5000); clock();

window.chrome?.webview?.addEventListener("message", e => {
  const m = e.data; edge = m.edge || "bottom";
  document.body.className = edge + (vert() ? " v" : "");
  $("wins").innerHTML = (m.wins || []).map(w => `<span class="b${w.id === m.fg ? " fg" : ""}${w.minimized ? " min" : ""}" data-id="${w.id}" title="${esc(w.title)}"><img src="${esc(w.art || "assets/icons/desktop.png")}" alt="" onerror="this.src='assets/icons/desktop.png'"></span>`).join("");
  clock(); fit();
});
addEventListener("resize", fit);

const win = e => e.target.closest("#wins .b");
document.addEventListener("mousedown", e => {
  if (e.button === 1) e.preventDefault();   // no autoscroll on middle-click
  if (e.button === 0 && !e.target.closest(".b")) post({ op: "drag" });   // the empty glass is the handle
});
document.addEventListener("click", e => {
  const w = win(e); if (w) return post({ op: "click", id: +w.dataset.id });
  if (e.target.closest("#orb")) post({ op: "menu" }); else if (e.target.closest("#tray")) post({ op: "tray" });
});
document.addEventListener("auxclick", e => { const w = win(e); if (w && e.button === 1) post({ op: "close", id: +w.dataset.id }); });
$("wins").addEventListener("wheel", e => { if (!vert()) { $("wins").scrollLeft += e.deltaY; e.preventDefault(); } }, { passive: false });
</script>
</body></html>
